name: Rebuild offline dist

# Keeps the committed packages/app/dist (used by start.command/start.cmd/
# start.sh for the zero-network offline launch) in sync with source. Ignores
# pushes that only touch dist/ itself, and the bot's own commits, to avoid
# triggering itself in a loop.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/app/dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-dist
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No EDITH_BASE_PATH here — defaults to '/', matching how server.mjs
      # serves the offline build locally (unlike the GitHub Pages deploy,
      # which needs the /edith/ subpath).
      - run: pnpm build

      - name: Commit the rebuilt dist, if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f packages/app/dist
          if git diff --cached --quiet; then
            echo "dist unchanged, nothing to commit"
          else
            git commit -m "chore: rebuild offline dist [skip ci]"
            git pull --rebase origin main
            git push
          fi
